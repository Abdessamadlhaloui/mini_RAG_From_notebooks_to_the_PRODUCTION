version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=mini-rag
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      mongodb:
        condition: service_started
    # Override CMD for development (hot-reload)
    # Comment this line and use the Dockerfile CMD for production
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
  chroma_data:
    driver: local
