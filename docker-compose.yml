version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=mini-rag
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - CHUNKING_SIMILARITY_THRESHOLD=0.75
      - CHUNKING_MAX_CHUNK_SIZE=1500
      - CHUNKING_CONTEXT_WINDOW=1
      - DOCUMENT_ENABLE_PDF_PROCESSING=true
      - DOCUMENT_ENABLE_OCR=true
      - DOCUMENT_ENABLE_LAYOUT_PARSING=true
      - DOCUMENT_ENABLE_TABLE_EXTRACTION=true
      - DOCUMENT_ENABLE_FORMULA_RECOGNITION=true
      - DOCUMENT_ENABLE_IMAGE_EXTRACTION=true
      - DOCUMENT_ENABLE_IMAGE_CAPTIONING=true
      - DOCUMENT_ENABLE_CONTEXTUAL_METADATA=true
      - DOCUMENT_ENABLE_MULTI_VECTOR_INDEXING=true
      - DOCUMENT_ENABLE_GRAPH_INDEXING=true
      - RAGAS_ENABLED=true
      - RAGAS_SAMPLE_SIZE=20
      - RAGAS_MIN_CONTEXTS=1
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  neo4j:
    image: neo4j:5.19.0
    container_name: rag_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.1.0
    container_name: rag_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
